name: daily lesson worker

on:
  schedule:
    # every day at 01:00 UTC — tune to your rhythm
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'real → AI lesson (needs model token); mock → canned lesson'
        required: true
        default: 'real'
        type: choice
        options:
          - real
          - mock

permissions:
  contents: write

env:
  # the site repo to teach into
  ODYSSEY_REPO: rolniuq/odyssey

jobs:
  generate-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout worker repo
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install worker deps
        run: bun install

      - name: Clone the Odyssey site repo
        run: git clone --depth=1 https://github.com/${ODYSSEY_REPO}.git ./odyssey

      - name: Generate the next lesson
        env:
          ODYSSEY_LESSONS_DIR: ${{ github.workspace }}/odyssey/src/content/lessons
          # Google Gemini free tier — grab a free key at https://ai.google.dev
          # and add it as a repo secret named GEMINI_API_KEY (no credit card).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.mode }}" = "real" ]; then
            if [ -z "${GEMINI_API_KEY}" ]; then
              echo "::error::GEMINI_API_KEY secret is not set on this repo. Add a free key from https://ai.google.dev (no billing)."
              exit 1
            fi
            bun run worker
          else
            bun run worker --mock
          fi

      - name: Verify the generated lesson (site gates)
        working-directory: ./odyssey
        run: |
          bun install
          bun run check
          bun run build

      - name: Push the new lesson to the site repo
        working-directory: ./odyssey
        env:
          PUSH_TOKEN: ${{ secrets.ODYSSEY_PUSH_TOKEN }}
        run: |
          if [ -z "${PUSH_TOKEN}" ]; then
            echo "::warning::ODYSSEY_PUSH_TOKEN secret not set — generated lesson kept local (not pushed)."
            exit 0
          fi
          git config user.name "odyssey-daily-worker"
          git config user.email "odyssey-daily-worker[bot]@users.noreply.github.com"
          git add src/content/lessons
          git commit -m "feat(lessons): add next daily concept ($(date -u +%F))" || { echo "nothing new"; exit 0; }
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${ODYSSEY_REPO}.git" HEAD:main

      - name: Save progress pointer back to the worker repo
        env:
          PUSH_TOKEN: ${{ secrets.ODYSSEY_PUSH_TOKEN }}
        run: |
          if [ -z "${PUSH_TOKEN}" ]; then
            echo "::warning::Not committing progress.json (no ODYSSEY_PUSH_TOKEN)."
            exit 0
          fi
          git config user.name "odyssey-daily-worker"
          git config user.email "odyssey-daily-worker[bot]@users.noreply.github.com"
          git add progress.json
          git commit -m "chore: advance curriculum to next lesson" || { echo "no progress change"; exit 0; }
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
